[package]
name = "allblack11-helper"
version = "3.8.0-preview.1"
edition = "2021"
description = "On-demand x64 helper for AllBlack11 on ARM64: hooks classic dialogs of emulated x64 apps."
license = "MIT"
publish = false

[[bin]]
name = "AllBlack11Helper"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
