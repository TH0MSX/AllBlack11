<!doctype html><html><head><meta charset="utf-8"><style>
/* 1600x800: the README banner. Pitch black, one moonlit rim, one glow. No colored blobs.
   Render with: node docs/banner-source/shot.js   (needs Playwright; nothing else) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:800px}
body{position:relative;overflow:hidden;background:#000;color:#fff;
 font-family:"Inter Display","Inter","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
/* A huge dark disc rising from below: the brand's moon, seen as a lit edge and nothing else.
   It is lighter than the page by about one percent, so it reads as depth, not as a shape. */
.moon{position:absolute;left:50%;top:618px;width:3000px;height:3000px;margin-left:-1500px;border-radius:50%;
 background:radial-gradient(ellipse at 50% 0%,#0b0e14 0%,#040507 22%,#000 46%);
 box-shadow:0 -1px 0 rgba(214,226,246,.85),0 -2px 3px rgba(150,190,255,.55),0 -14px 70px rgba(100,160,255,.30),0 -60px 160px rgba(80,130,255,.10)}
/* The rim is brightest at the top centre and dies away to the sides. */
.rim-mask{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 78%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 28%,#000 62%)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.logo{margin-top:78px;width:128px;height:128px;position:relative}
.logo::before{content:"";position:absolute;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(110,170,255,.40) 0%,rgba(110,170,255,.13) 36%,rgba(110,170,255,0) 66%)}
.logo img{position:relative;width:128px;height:128px;border-radius:30px;
 filter:drop-shadow(0 0 16px rgba(120,180,255,.6)) drop-shadow(0 12px 30px rgba(0,0,0,.8))}
h1{margin-top:30px;font-size:158px;line-height:1;font-weight:600;letter-spacing:-.045em;
 background:linear-gradient(180deg,#ffffff 25%,#b9c4da 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:26px;font-size:44px;line-height:1.2;font-weight:500;letter-spacing:-.015em;color:#f1f4fb;text-align:center}
.sub{margin-top:12px;font-size:29px;line-height:1.3;font-weight:400;letter-spacing:-.005em;color:#8f9ab2;text-align:center}
.pills{position:absolute;bottom:58px;display:flex;gap:14px}
.pill{padding:10px 24px;border-radius:999px;font-size:23px;font-weight:600;letter-spacing:.01em;color:#cfd8ec;
 background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(200,215,240,.22)}
.pill.on{color:#fff;background:rgba(91,180,240,.18);box-shadow:inset 0 0 0 1.5px rgba(120,195,255,.7)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:screen}
</style></head><body>
<div class="moon"></div>
<svg class="grain" width="1600" height="800"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="stage">
  <div class="logo"><img src="../../assets/brand/png/allblack11-512.png" alt=""></div>
  <h1>AllBlack11</h1>
  <div class="lead">Pitch-black Windows 11.</div>
  <div class="sub">Title bars, borders, taskbar and Start. Try any look for 15 seconds, then keep it or put it back.</div>
  <div class="pills"><span class="pill on">Native ARM64 + x64</span><span class="pill">3.8 Preview</span><span class="pill">Free &amp; open source</span></div>
</div>
</body></html>
