<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:800px;background:#000;overflow:hidden;position:relative;font-family:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;color:#fff}
.glow{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 78% 55%,rgba(1,133,116,.38),transparent 62%),
 radial-gradient(600px 400px at 8% 100%,rgba(1,133,116,.16),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(70% 90% at 70% 50%,#000,transparent)}
.left{position:absolute;left:76px;top:128px;width:660px}
.brand{display:flex;align-items:center;gap:26px}
.brand img{width:120px;height:120px;border-radius:30px;box-shadow:0 0 60px rgba(1,133,116,.45)}
h1{font-size:92px;font-weight:700;letter-spacing:-3px;line-height:1}
.pill{display:inline-block;margin-top:34px;padding:9px 22px;border-radius:999px;border:1.5px solid #1fb8a2;color:#37e0c8;font-weight:600;font-size:26px;letter-spacing:3px;background:rgba(31,184,162,.08)}
.tag{margin-top:30px;font-size:42px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.tag span{color:#37e0c8}
.sub{margin-top:18px;font-size:24px;color:#a9b3b1}
.chips{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px;width:640px}
.chips b{font-weight:500;font-size:22px;padding:9px 18px;border-radius:12px;background:#0e1413;border:1px solid #1f2b29;color:#d7e3e0}
.shot{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.12)}
.shot img{display:block;width:100%}
.start{left:880px;top:70px;width:650px;transform:rotate(1.2deg)}
.settings{left:810px;top:372px;width:450px;transform:rotate(-1.5deg);box-shadow:0 30px 90px rgba(0,0,0,.9),0 0 0 1px rgba(55,224,200,.45),0 0 70px rgba(1,133,116,.45)}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="left">
  <div class="brand"><img src="icon.png"><h1>AllBlack11</h1></div>
  <div class="pill">3.0 PREVIEW</div>
  <div class="tag">True black for <span>Windows 11</span></div>
  <div class="sub">Native ARM64 &amp; x64 · no admin · fully reversible</div>
  <div class="chips"><b>Setup.exe</b><b>Live preview</b><b>Presets</b><b>Restart Explorer</b></div>
</div>
<div class="shot start"><img src="start.png"></div>
<div class="shot settings"><img src="settings.png"></div>
</body></html>
