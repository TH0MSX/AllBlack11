<!doctype html><html><head><meta charset="utf-8"><style>
/* 1600x800: the README banner and the GitHub social preview.
   Render with: node docs/banner-source/shot.js   (needs Playwright; nothing else) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:800px}
body{position:relative;overflow:hidden;background:#04050a;color:#fff;
 font-family:"Inter Display","Inter","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
/* Soft light: a few blurred blobs on near-black, kept dark so text stays readable. */
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.b1{left:430px;top:-300px;width:740px;height:620px;background:#2c4f9e;opacity:.55}
.b2{left:-260px;top:380px;width:760px;height:620px;background:#3a2468;opacity:.50}
.b3{left:1060px;top:420px;width:780px;height:600px;background:#0f4c63;opacity:.50}
.b4{left:560px;top:120px;width:480px;height:320px;background:#6f86d6;opacity:.16}
.vignette{position:absolute;inset:0;
 background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%)}
/* Fine grain so the dark gradients do not band. */
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.logo{margin-top:88px;width:132px;height:132px;position:relative}
.logo::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(110,170,255,.42) 0%,rgba(110,170,255,.14) 38%,rgba(110,170,255,0) 68%)}
.logo img{position:relative;width:132px;height:132px;border-radius:30px;
 filter:drop-shadow(0 0 18px rgba(120,180,255,.55)) drop-shadow(0 10px 28px rgba(0,0,0,.6))}
h1{margin-top:34px;font-size:150px;line-height:1;font-weight:600;letter-spacing:-.04em;
 background:linear-gradient(180deg,#ffffff 20%,#c9d3e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:30px;font-size:41px;line-height:1.25;font-weight:500;letter-spacing:-.012em;color:#eef2fb;text-align:center}
.sub{margin-top:14px;font-size:30px;line-height:1.3;font-weight:400;letter-spacing:-.005em;color:#aeb8cf;text-align:center}
.pills{margin-top:44px;display:flex;gap:16px}
.pill{padding:11px 26px;border-radius:999px;font-size:25px;font-weight:600;letter-spacing:.01em;color:#dbe6ff;
 background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(160,190,255,.35)}
.pill.on{color:#fff;background:rgba(91,180,240,.22);box-shadow:inset 0 0 0 1.5px rgba(120,195,255,.7)}
.url{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.02em;color:#8590aa}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div class="vignette"></div>
<svg class="grain" width="1600" height="800"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="stage">
  <div class="logo"><img src="../../assets/brand/png/allblack11-512.png" alt=""></div>
  <h1>AllBlack11</h1>
  <div class="lead">Make Windows 11 truly black: title bars, borders, taskbar and Start.</div>
  <div class="sub">Preview any look for 15 seconds, then keep it or put it back.</div>
  <div class="pills"><span class="pill on">Native ARM64 + x64</span><span class="pill">3.7 Preview</span><span class="pill">Free &amp; open source</span></div>
</div>
<div class="url">github.com/TH0MSX/AllBlack11</div>
</body></html>
