name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc
      - name: Install LLVM resource tools and cargo-xwin
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang lld zip
          curl -fsSL -o /tmp/cargo-xwin.tar.gz \
            https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-xwin.tar.gz -C /tmp
          sudo install -m 755 /tmp/cargo-xwin /usr/local/bin/cargo-xwin
      - name: Build, check the CPU type of every binary, and pack
        run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/AllBlack11-Setup-${{ matrix.arch }}.exe
            dist/AllBlack11-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { heading = "## " ver }
            $0 == heading { found = 1 }
            found && /^## / && $0 != heading { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          body_path: notes.md
          # A tag with a suffix (v3.6.0-preview.1) is a pre-release and never becomes "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
