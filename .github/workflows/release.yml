name: Release

on:
  push:
    tags:
      - "v*"
  # Start a release by hand, for when a tag cannot be pushed from where the work was done. It
  # creates the tag on the commit it runs from, after checking that the tag has the right
  # shape and matches the version in Cargo.toml.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, for example v3.8.0-preview.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - name: The tag has the right shape and matches Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "'$TAG' is not a version tag like v3.8.0-preview.1" >&2
            exit 1
          fi
          version="${TAG#v}"
          if ! grep -q "^version = \"${version}\"" Cargo.toml; then
            echo "Cargo.toml does not say version ${version}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc
      - name: Install LLVM resource tools and cargo-xwin
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang lld zip
          curl -fsSL -o /tmp/cargo-xwin.tar.gz \
            https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-xwin.tar.gz -C /tmp
          sudo install -m 755 /tmp/cargo-xwin /usr/local/bin/cargo-xwin
      - name: Build, check the CPU type of every binary, and pack
        run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/AllBlack11-Setup-${{ matrix.arch }}.exe
            dist/AllBlack11-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            BEGIN { heading = "## " ver }
            $0 == heading { found = 1 }
            found && /^## / && $0 != heading { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          body_path: notes.md
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # A tag with a suffix (v3.8.0-preview.1) is a pre-release and never becomes "latest".
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
