name: CI

on:
  push:
    branches: [main, 'claude/next-preview-3.6']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc
      - name: Format
        run: |
          cargo fmt --check
          (cd hook && cargo fmt --check)
          (cd setup && cargo fmt --check)
          (cd harness && cargo fmt --check)
          (cd helper && cargo fmt --check)
      - name: Unit tests (Linux host; pure logic only)
        run: cargo test --lib
      - name: Every Settings control is still on a page
        run: python3 scripts/check-controls.py
      - name: Type-check every Windows crate for both CPUs
        run: |
          for target in aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
            cargo check --target $target
            (cd hook && cargo check --target $target)
            (cd harness && cargo check --target $target)
            (cd harness && cargo check --target $target --features classic)
          done
          (cd helper && cargo check --target x86_64-pc-windows-msvc)
      - name: Clippy (errors only)
        run: cargo clippy --target aarch64-pc-windows-msvc -- -A warnings

  # A real Windows runner. This is the only job that compiles and tests the Windows-only code
  # natively; the Linux job above only cross-compiles it. A pass here still does not exercise
  # the tray, Settings window, hooks or helper: nothing in CI does. That is the hardware smoke
  # test's job.
  #
  # Only ARM64 runs natively. The build script needs llvm-rc and llvm-cvtres; the
  # windows-11-arm image has them and windows-latest (x64) does not (LLVM from Chocolatey ships
  # no llvm-cvtres), so x64 is covered by the cross-compile in the job above instead.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM resource tools are present
        shell: pwsh
        run: |
          Get-Command llvm-rc, llvm-cvtres | Format-Table Name, Source
      - name: Unit tests (native Windows ARM64)
        run: cargo test --lib
      - name: Build every ARM64 crate natively
        run: |
          cargo build
          cd hook; cargo build; cd ..
          cd harness; cargo build; cd ..
      - name: Windows-only code compiles under test
        run: cargo test --no-run
