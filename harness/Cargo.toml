[package]
name = "allblack11-harness"
version = "3.8.0-preview.2"
edition = "2021"
description = "Native test surface for the AllBlack11 legacy layer: every supported control family and state."
license = "MIT"
publish = false

[features]
# Build without the Common Controls 6 manifest, like an old unmanifested app.
classic = []

[[bin]]
name = "AllBlack11-Harness"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
