[package]
name = "allblack11-hook"
version = "3.6.0-preview.2"
edition = "2021"
description = "Opt-in, same-architecture hook that recolors classic Windows dialogs."
license = "MIT"
publish = false

[lib]
name = "AllBlack11Hook"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
